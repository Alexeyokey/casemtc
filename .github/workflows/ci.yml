name: CI

"on":
  push:
    branches: [main, codex/s1-s5-integration]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      APP_PORT: "18080"
      CASEMTC_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -B -m pytest -q

      - name: Check chat session isolation
        run: node --test tests/demo_chat.test.mjs

      - name: Run the packaged solution against a local test proxy
        run: |
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          python -B scripts/benchmark_submission.py --rounds 1 \
            --artifact "$scratch/submission.zip" --output "$scratch/report.json"
          jq -e '.artifact_matches_commit and .cold.questions == 3 and .cold.chat_requests == 2' "$scratch/report.json"

      - name: Check the web demo and persistent storage
        id: compose
        run: |
          base_url="http://127.0.0.1:$APP_PORT"
          docker compose up --build --wait --wait-timeout 60
          curl --fail --silent --show-error --max-time 5 "$base_url/api/v1/health" | jq -e '.status == "ok" and .build_sha == env.CASEMTC_BUILD_SHA'
          curl --fail --silent --show-error --max-time 5 "$base_url/" | grep -F 'Консультант МТС EnergyTool'
          created=$(curl --fail --silent --show-error --max-time 5 -H 'Content-Type: application/json' -d '{}' "$base_url/api/v1/sessions")
          session_id=$(jq -r .session_id <<< "$created")
          token=$(jq -r .client_token <<< "$created")
          session_url="$base_url/api/v1/sessions/$session_id"
          message='CI persistence check'
          curl --fail --silent --show-error --max-time 5 --output /dev/null \
            -H "X-Client-Token: $token" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg text "$message" '{request_id:"ci-persistence",text:$text}')" "$session_url/messages"

          docker compose down
          docker compose up --wait --wait-timeout 60
          curl --fail --silent --show-error --max-time 5 -H "X-Client-Token: $token" "$session_url" \
            | jq -e --arg text "$message" 'any(.messages[]; .content == $text)'

      - name: Show Compose logs on failure
        if: failure() && steps.compose.outcome == 'failure'
        run: docker compose logs --no-color

      - name: Remove Compose resources
        if: always() && steps.compose.outcome != 'skipped'
        run: docker compose down --volumes
