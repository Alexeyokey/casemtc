<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>МТС EnergyTool</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #181b24; background: #f4f5f8; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 44rem; margin: auto; padding: 1.5rem 1rem 3rem; }
    header { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; }
    h1, h2 { margin: 0; line-height: 1.25; }
    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.15rem; }
    section, article, #chat { margin-top: .75rem; padding: 1rem; border-radius: .65rem; background: white; }
    article.user { margin-left: 1.5rem; background: #e8ebf2; }
    article[data-interrupted="true"] { border: 1px dashed #757883; }
    label { display: block; margin-top: .45rem; }
    button, input, textarea { font: inherit; border: 1px solid #777d8d; border-radius: .4rem; padding: .45rem .65rem; }
    input, textarea { width: 100%; }
    button { cursor: pointer; background: white; color: inherit; }
    button.primary { background: #ad0028; color: white; border-color: #ad0028; }
    button:disabled { opacity: .55; cursor: default; }
    button + button { margin-left: .25rem; }
    p { overflow-wrap: anywhere; white-space: pre-wrap; }
    #status { min-height: 1.5rem; }
    #status[data-error="true"] { color: #a90027; }
    #lead-preview { white-space: pre-wrap; }
    [hidden] { display: none; }
  </style>
  <script src="/demo.js" defer></script>
</head>
<body>
  <main>
    <header><h1>Консультант МТС EnergyTool</h1><button id="new" type="button">Новый диалог</button></header>
    <p id="mode">Демонстрационный интерфейс. Используйте тестовые контакты.</p>
    <div id="messages" role="log" aria-label="Переписка"></div>
    <form id="chat">
      <label for="message">Сообщение</label>
      <textarea id="message" rows="2" maxlength="10000" required placeholder="Например, как настроить учёт электроэнергии?"></textarea>
      <button class="primary" id="send" type="submit">Отправить</button>
      <button id="retry" type="button" hidden>Повторить</button>
      <button id="cancel" type="button" hidden>Остановить</button>
    </form>
    <p id="status" role="status"></p>
    <section id="lead" aria-labelledby="lead-title" hidden>
      <h2 id="lead-title">Заявка на обратную связь</h2>
      <p id="lead-status"></p>
      <form id="contacts">
        <label for="phone">Тестовый телефон</label>
        <input id="phone" name="phone" type="tel" autocomplete="off" maxlength="40" required>
        <label for="company">Компания</label>
        <input id="company" name="company" type="text" maxlength="300">
        <button type="submit">Проверить контакты</button>
      </form>
      <p id="lead-preview"></p>
      <button id="save" class="primary" type="button" hidden>Сохранить заявку</button>
      <button id="refuse" type="button">Продолжить без заявки</button>
    </section>
  </main>
</body>
</html>
